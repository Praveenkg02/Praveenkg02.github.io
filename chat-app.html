<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexChat — Real-Time Chat</title>

<!--
  ============================================================
  NexChat - Real-Time Chat App
  Built by: Praveen Kumar
  Tech: HTML, CSS, Vanilla JS, Ably WebSockets (Pub/Sub)
  How it works:
    - Each room = one Ably channel
    - Users publish messages to that channel
    - All connected users receive them instantly via WebSocket
    - Presence API shows who is online in real time
  ============================================================

  SETUP: Replace YOUR_ABLY_API_KEY below with your key from:
  https://ably.com → Sign up free → Create App → API Keys
-->

<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:            #0a0c12;
    --surface:       #111420;
    --panel:         #161926;
    --border:        #1f2537;
    --accent:        #4f7cff;
    --accent2:       #00e5c3;
    --danger:        #ff4f6a;
    --text:          #e8ecf7;
    --muted:         #5a6080;
    --bubble-me:     #1e2d6e;
    --bubble-other:  #161926;
    --online:        #00e5a0;
  }

  html, body { height: 100%; background: var(--bg); font-family: 'Syne', sans-serif; color: var(--text); overflow: hidden; }

  /* subtle grid overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(79,124,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,124,255,0.025) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  /* ── JOIN SCREEN ── */
  #join-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  #join-screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }

  .join-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 44px 40px;
    width: 400px; max-width: 93vw;
    position: relative; overflow: hidden;
  }
  /* glow accents on card */
  .join-card::before {
    content: ''; position: absolute; top: -50px; right: -50px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(79,124,255,0.2) 0%, transparent 70%);
    pointer-events: none;
  }
  .join-card::after {
    content: ''; position: absolute; bottom: -40px; left: -40px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(0,229,195,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .logo { font-size: 26px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px; }
  .logo .blue { color: var(--accent); }
  .logo .green { color: var(--accent2); font-style: italic; }
  .tagline { color: var(--muted); font-size: 12px; margin-bottom: 32px; font-family: 'Space Mono', monospace; }

  label {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 2px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 7px;
  }
  input[type=text] {
    width: 100%; background: var(--panel);
    border: 1.5px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: 'Space Mono', monospace;
    font-size: 14px; padding: 11px 14px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s; margin-bottom: 20px;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,124,255,0.15); }
  input[type=text]::placeholder { color: var(--muted); }
  input[type=text].error { border-color: var(--danger); }

  .room-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .pill {
    background: var(--panel); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    color: var(--muted); transition: all 0.15s; font-family: 'Space Mono', monospace;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { border-color: var(--accent); color: var(--accent); background: rgba(79,124,255,0.1); }

  .join-btn {
    width: 100%; padding: 13px;
    background: var(--accent); border: none; border-radius: 10px;
    color: #fff; font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.3px;
  }
  .join-btn:hover { opacity: 0.87; }
  .join-btn:active { transform: scale(0.98); }
  .join-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-msg { font-size: 12px; text-align: center; margin-top: 12px; color: var(--muted); font-family: 'Space Mono', monospace; min-height: 18px; }
  .status-msg.err { color: var(--danger); }

  /* ── MAIN LAYOUT ── */
  #app { display: grid; grid-template-columns: 250px 1fr; height: 100vh; position: relative; z-index: 1; }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-top { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .sidebar-logo .blue { color: var(--accent); }
  .sidebar-user { font-size: 11px; color: var(--accent2); font-family: 'Space Mono', monospace; margin-top: 3px; }

  .sec-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase;
    padding: 14px 18px 7px;
  }

  .room-list { padding: 0 8px; }
  .room-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; border-radius: 9px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    cursor: pointer; transition: all 0.15s; margin-bottom: 2px;
    position: relative;
  }
  .room-item:hover { background: var(--panel); color: var(--text); }
  .room-item.active { background: rgba(79,124,255,0.14); color: var(--accent); }
  .room-hash { font-family: 'Space Mono', monospace; font-size: 14px; }
  .unread-badge {
    margin-left: auto; background: var(--accent); color: white;
    font-size: 10px; font-weight: 700; border-radius: 10px;
    padding: 1px 7px; font-family: 'Space Mono', monospace;
  }

  /* online users list */
  .online-list { padding: 0 8px 12px; flex: 1; overflow-y: auto; }
  .online-user {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 12px; font-size: 13px; color: var(--muted); font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--online); flex-shrink: 0; box-shadow: 0 0 6px var(--online); }

  /* ── CHAT AREA ── */
  .chat-area { display: flex; flex-direction: column; background: var(--bg); }

  .chat-top {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 22px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .chat-room-name { font-size: 15px; font-weight: 700; }
  .chat-hash { font-family: 'Space Mono', monospace; color: var(--accent); font-size: 18px; }
  .chat-desc { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .online-pill {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); box-shadow: 0 0 5px var(--online); animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* messages */
  #messages {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 2px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-group { margin-bottom: 12px; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .msg-row { display: flex; }
  .msg-row.me { flex-direction: row-reverse; }

  .msg-inner {
    display: flex; flex-direction: column;
    align-items: flex-start; max-width: 68%;
  }
  .msg-row.me .msg-inner { align-items: flex-end; }

  .msg-meta {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;
  }
  .msg-row.me .msg-meta { flex-direction: row-reverse; }
  .msg-author { font-size: 12px; font-weight: 700; color: var(--accent2); }
  .msg-author.me { color: var(--accent); }
  .msg-time { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; }

  .bubble {
    background: var(--bubble-other); border: 1px solid var(--border);
    border-radius: 14px; padding: 9px 14px;
    font-size: 14px; line-height: 1.55; word-break: break-word;
  }
  .bubble.me { background: var(--bubble-me); border-color: rgba(79,124,255,0.35); }

  /* system messages */
  .sys-msg {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace;
    text-align: center; margin: 8px 0;
  }
  .sys-msg::before, .sys-msg::after { content:''; flex:1; height:1px; background: var(--border); }

  /* typing indicator */
  .typing-bar {
    padding: 4px 24px 8px;
    font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace;
    min-height: 24px; transition: opacity 0.3s;
  }

  /* ── INPUT ── */
  .input-area { padding: 14px 20px 18px; background: var(--surface); border-top: 1px solid var(--border); }
  .input-wrap {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1.5px solid var(--border);
    border-radius: 13px; padding: 7px 7px 7px 16px;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  #msg-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'Syne', sans-serif; font-size: 14px;
    resize: none; max-height: 90px;
  }
  #msg-input::placeholder { color: var(--muted); }
  .send-btn {
    background: var(--accent); border: none; border-radius: 9px;
    width: 38px; height: 38px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s, transform 0.1s;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.92); }
  .send-btn svg { fill: white; width: 17px; height: 17px; }

  /* connection banner */
  #conn-banner {
    display: none; padding: 8px 20px;
    background: rgba(255,79,106,0.12); border-bottom: 1px solid rgba(255,79,106,0.3);
    font-size: 12px; color: var(--danger); font-family: 'Space Mono', monospace;
    text-align: center;
  }
  #conn-banner.show { display: block; }

  @media (max-width: 620px) {
    #app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<!-- ══ JOIN SCREEN ══ -->
<div id="join-screen">
  <div class="join-card">
    <div class="logo">Nex<span class="blue">Chat</span><span class="green">.</span></div>
    <div class="tagline">// real-time · multi-room · live presence</div>

    <label for="u-input">Your username</label>
    <input type="text" id="u-input" placeholder="e.g. praveen_dev" maxlength="20" autocomplete="off"/>

    <label>Choose a room</label>
    <div class="room-pills">
      <div class="pill active" data-room="general"># general</div>
      <div class="pill" data-room="tech"># tech</div>
      <div class="pill" data-room="projects"># projects</div>
      <div class="pill" data-room="random"># random</div>
    </div>

    <button class="join-btn" id="join-btn">Connect →</button>
    <div class="status-msg" id="status-msg"></div>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">Nex<span class="blue">Chat</span></div>
      <div class="sidebar-user" id="sb-user">connecting...</div>
    </div>

    <div class="sec-label">Channels</div>
    <div class="room-list">
      <div class="room-item active" data-room="general"><span class="room-hash">#</span> general</div>
      <div class="room-item" data-room="tech"><span class="room-hash">#</span> tech</div>
      <div class="room-item" data-room="projects"><span class="room-hash">#</span> projects</div>
      <div class="room-item" data-room="random"><span class="room-hash">#</span> random</div>
    </div>

    <div class="sec-label">Online Now</div>
    <div class="online-list" id="online-list"></div>
  </div>

  <!-- CHAT -->
  <div class="chat-area">
    <div id="conn-banner">⚠ Reconnecting to server...</div>

    <div class="chat-top">
      <span class="chat-hash">#</span>
      <span class="chat-room-name" id="hdr-room">general</span>
      <span class="chat-desc" id="hdr-desc">General conversation</span>
      <div class="online-pill">
        <div class="live-dot"></div>
        <span id="online-count">0 online</span>
      </div>
    </div>

    <div id="messages"></div>
    <div class="typing-bar" id="typing-bar"></div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="msg-input" rows="1" placeholder="Message #general..."></textarea>
        <button class="send-btn" id="send-btn">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
// ================================================================
//  NexChat — Real-Time Chat using Ably WebSockets
//  Author: Praveen Kumar
//
//  Architecture:
//  - Ably handles WebSocket connections (pub/sub model)
//  - Each chat room = one Ably channel
//  - Messages published to channel → delivered to all subscribers
//  - Presence API tracks who is online in each room
//  - Typing indicators use a separate 'typing' event
//
//  To run: Replace ABLY_API_KEY with your key from ably.com
// ================================================================

// ── CONFIG ──────────────────────────────────────────────────────
const ABLY_API_KEY = 'nDeHhg.6c7m8Q:Y3apdYlICoxf1PsQBrlEf1FoEwlhk-VJomXX80GT1D8'; // <-- paste your key here

const ROOM_DESCS = {
  general:  'General conversation',
  tech:     'Tech talk & code',
  projects: 'Show & tell projects',
  random:   'Off-topic & fun',
};

// ── STATE ────────────────────────────────────────────────────────
let myUsername   = '';
let currentRoom  = 'general';
let ablyClient   = null;
let activeChannel = null;           // current Ably channel
let roomChannels  = {};             // cache of joined channels
let roomMessages  = { general:[], tech:[], projects:[], random:[] };
let unread        = { general:0, tech:0, projects:0, random:0 };
let typingTimer   = null;
let isTyping      = false;

// ── DOM REFS ─────────────────────────────────────────────────────
const joinScreen  = document.getElementById('join-screen');
const uInput      = document.getElementById('u-input');
const joinBtn     = document.getElementById('join-btn');
const statusMsg   = document.getElementById('status-msg');
const sbUser      = document.getElementById('sb-user');
const messagesEl  = document.getElementById('messages');
const msgInput    = document.getElementById('msg-input');
const sendBtn     = document.getElementById('send-btn');
const typingBar   = document.getElementById('typing-bar');
const onlineCount = document.getElementById('online-count');
const onlineList  = document.getElementById('online-list');
const hdrRoom     = document.getElementById('hdr-room');
const hdrDesc     = document.getElementById('hdr-desc');
const connBanner  = document.getElementById('conn-banner');

// ── JOIN SCREEN LOGIC ────────────────────────────────────────────

// room pill selection
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    currentRoom = p.dataset.room;
  });
});

uInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinBtn.click(); });

joinBtn.addEventListener('click', async () => {
  const name = uInput.value.trim().replace(/\s+/g, '_');
  if (!name) {
    uInput.classList.add('error');
    uInput.focus();
    return;
  }
  uInput.classList.remove('error');

  // check API key is set
  if (ABLY_API_KEY === 'YOUR_ABLY_API_KEY') {
    statusMsg.textContent = '⚠ No API key set. See setup instructions.';
    statusMsg.className = 'status-msg err';
    return;
  }

  myUsername = name;
  joinBtn.disabled = true;
  statusMsg.textContent = 'Connecting to server...';
  statusMsg.className = 'status-msg';

  try {
    await initAbly();
    // success — hide join screen
    joinScreen.classList.add('hidden');
    sbUser.textContent = '@' + myUsername;
    await switchRoom(currentRoom);
    updateRoomHeader();
  } catch (err) {
    joinBtn.disabled = false;
    statusMsg.textContent = '✕ Connection failed. Check your API key.';
    statusMsg.className = 'status-msg err';
    console.error('Ably connect error:', err);
  }
});

// ── ABLY INIT ────────────────────────────────────────────────────

async function initAbly() {
  // Create Ably client with clientId = username
  ablyClient = new Ably.Realtime({
    key: ABLY_API_KEY,
    clientId: myUsername,
  });

  // Wait for connection
  await new Promise((resolve, reject) => {
    ablyClient.connection.once('connected', resolve);
    ablyClient.connection.once('failed', reject);
    setTimeout(reject, 8000); // 8s timeout
  });

  // Monitor connection state for banner
  ablyClient.connection.on('disconnected', () => connBanner.classList.add('show'));
  ablyClient.connection.on('suspended',    () => connBanner.classList.add('show'));
  ablyClient.connection.on('connected',    () => connBanner.classList.remove('show'));
}

// ── ROOM / CHANNEL MANAGEMENT ────────────────────────────────────

async function switchRoom(roomName) {
  // detach presence listener from old channel (but stay subscribed for messages)
  if (activeChannel) {
    activeChannel.presence.unsubscribe();
  }

  currentRoom = roomName;
  unread[roomName] = 0;
  updateBadge(roomName);
  updateRoomHeader();
  renderMessages();
  msgInput.placeholder = `Message #${roomName}...`;

  // get or create channel for this room
  if (!roomChannels[roomName]) {
    const ch = ablyClient.channels.get(`nexchat-${roomName}`);

    // subscribe to incoming messages on this channel
    ch.subscribe('msg', (ablyMsg) => {
      const data = ablyMsg.data;
      roomMessages[roomName].push(data);
      if (roomName === currentRoom) {
        renderMessages();
      } else {
        unread[roomName]++;
        updateBadge(roomName);
      }
    });

    // subscribe to typing events
    ch.subscribe('typing', (ablyMsg) => {
      if (ablyMsg.data.user !== myUsername && roomName === currentRoom) {
        typingBar.textContent = `${ablyMsg.data.user} is typing...`;
        clearTimeout(window._typingClear);
        window._typingClear = setTimeout(() => { typingBar.textContent = ''; }, 2200);
      }
    });

    roomChannels[roomName] = ch;
  }

  activeChannel = roomChannels[roomName];

  // enter presence for this room (lets others see you're online)
  try {
    await activeChannel.presence.enter({ room: roomName });
  } catch(e) { /* already entered, fine */ }

  // listen for presence changes (join/leave)
  activeChannel.presence.subscribe((presenceMsg) => {
    updatePresence(roomName);

    // show join/leave system messages
    if (presenceMsg.action === 'enter' && presenceMsg.clientId !== myUsername) {
      addSysMsg(roomName, `${presenceMsg.clientId} joined #${roomName}`);
    }
    if (presenceMsg.action === 'leave') {
      addSysMsg(roomName, `${presenceMsg.clientId} left`);
    }
  });

  // get current presence members
  updatePresence(roomName);
}

// fetch who is currently present and update UI
async function updatePresence(roomName) {
  if (!roomChannels[roomName]) return;
  try {
    const members = await roomChannels[roomName].presence.get();
    if (roomName === currentRoom) {
      onlineCount.textContent = `${members.length} online`;
      onlineList.innerHTML = members.map(m =>
        `<div class="online-user"><div class="dot"></div>${m.clientId}</div>`
      ).join('');
    }
  } catch(e) {}
}

// ── SEND MESSAGE ─────────────────────────────────────────────────

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || !activeChannel) return;

  const msgData = {
    author: myUsername,
    text:   text,
    time:   new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    id:     Date.now() + Math.random(),
  };

  // publish to Ably channel — all subscribers (including me) receive it
  activeChannel.publish('msg', msgData);

  // clear input
  msgInput.value = '';
  msgInput.style.height = 'auto';

  // stop typing indicator
  isTyping = false;
}

sendBtn.addEventListener('click', sendMessage);

msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// auto-resize textarea + broadcast typing event
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 90) + 'px';

  // publish typing event (throttled)
  if (!isTyping && activeChannel) {
    isTyping = true;
    activeChannel.publish('typing', { user: myUsername });
    typingTimer = setTimeout(() => { isTyping = false; }, 2000);
  }
});

// ── ROOM SWITCHING (sidebar) ──────────────────────────────────────

document.querySelectorAll('#app .room-item').forEach(item => {
  item.addEventListener('click', async () => {
    const room = item.dataset.room;
    if (room === currentRoom) return;

    document.querySelectorAll('#app .room-item').forEach(x => x.classList.remove('active'));
    item.classList.add('active');

    await switchRoom(room);
  });
});

// ── RENDER MESSAGES ───────────────────────────────────────────────

function renderMessages() {
  const msgs = roomMessages[currentRoom];
  messagesEl.innerHTML = '';
  let lastAuthor = null;

  msgs.forEach(msg => {
    // system message
    if (msg.sys) {
      const d = document.createElement('div');
      d.className = 'sys-msg';
      d.textContent = msg.text;
      messagesEl.appendChild(d);
      lastAuthor = null;
      return;
    }

    const isMe = msg.author === myUsername;
    const group = document.createElement('div');
    group.className = 'msg-group';

    const row = document.createElement('div');
    row.className = 'msg-row' + (isMe ? ' me' : '');

    const inner = document.createElement('div');
    inner.className = 'msg-inner';

    // only show author name when it changes
    if (msg.author !== lastAuthor) {
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `
        <span class="msg-author${isMe ? ' me' : ''}">${msg.author}</span>
        <span class="msg-time">${msg.time}</span>
      `;
      inner.appendChild(meta);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isMe ? ' me' : '');
    bubble.textContent = msg.text;
    inner.appendChild(bubble);

    row.appendChild(inner);
    group.appendChild(row);
    messagesEl.appendChild(group);
    lastAuthor = msg.author;
  });

  // scroll to latest message
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── HELPERS ───────────────────────────────────────────────────────

function updateRoomHeader() {
  hdrRoom.textContent = currentRoom;
  hdrDesc.textContent = ROOM_DESCS[currentRoom];
}

function updateBadge(room) {
  const item = document.querySelector(`#app .room-item[data-room="${room}"]`);
  if (!item) return;
  let badge = item.querySelector('.unread-badge');
  if (unread[room] > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'unread-badge';
      item.appendChild(badge);
    }
    badge.textContent = unread[room];
  } else if (badge) {
    badge.remove();
  }
}

function addSysMsg(room, text) {
  roomMessages[room].push({ sys: true, text });
  if (room === currentRoom) renderMessages();
}
</script>
